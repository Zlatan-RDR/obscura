name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Toolchain and Build
        run: |
          set -e
          sudo DEBIAN_FRONTEND=noninteractive apt-get --quiet update || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=--force-confold install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zip || true
          
          mkdir -p /tmp/v8_prebuilt
          curl -fL -o /tmp/v8_prebuilt/librusty_v8.a.gz \
            https://github.com/denoland/rusty_v8/releases/download/v150.4.0/librusty_v8_simdutf_release_aarch64-unknown-linux-gnu.a.gz
          export RUSTY_V8_ARCHIVE=/tmp/v8_prebuilt/librusty_v8.a.gz
          
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          cargo build --target aarch64-unknown-linux-gnu --release

      - name: Package Signed Android APK
        run: |
          set -e
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          PLATFORM_JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | tail -n 1)

          mkdir -p apk_workspace/lib/arm64-v8a

          cat << 'MANIFEST' > AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.obscura.browser"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="Obscura" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          $BUILD_TOOLS_DIR/aapt package -F raw.apk -M AndroidManifest.xml -I $PLATFORM_JAR -f

          cp target/aarch64-unknown-linux-gnu/release/obscura apk_workspace/lib/arm64-v8a/libobscura.so
          cp target/aarch64-unknown-linux-gnu/release/obscura-worker apk_workspace/lib/arm64-v8a/libobscura_worker.so

          cd apk_workspace
          zip -ur ../raw.apk lib/
          cd ..

          $BUILD_TOOLS_DIR/zipalign -v -p 4 raw.apk obscura-aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Obscura,O=Dev,C=US"

          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out obscura-arm64-signed.apk obscura-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-arm64-apk
          path: obscura-arm64-signed.apk
